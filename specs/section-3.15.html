<section id="section-3.15">
<h3 id="name-boolean">
<a class="section-number selfRef" href="#section-3.15">3.15. </a><a class="section-name selfRef" href="#name-boolean">Boolean</a>
</h3>
<p id="section-3.15-1">A boolean Value (<a class="auto internal xref" href="#value">Section 3.7</a>) is either the symbol <code>#true</code> or <code>#false</code>. These
<em>SHOULD</em> be represented by implementation as boolean logical values, or some
approximation thereof.<a class="pilcrow" href="#section-3.15-1">¶</a></p>
<div id="example-6">
<section id="section-3.15.1">
<h4 id="name-example-7">
<a class="section-number selfRef" href="#section-3.15.1">3.15.1. </a><a class="section-name selfRef" href="#name-example-7">Example</a>
</h4>
<div class="lang-kdl sourcecode" id="section-3.15.1-1">
<pre>
my-node #true value=#false
</pre><a class="pilcrow" href="#section-3.15.1-1">¶</a>
</div>
