<section id="section-3.16">
<h3 id="name-null">
<a class="section-number selfRef" href="#section-3.16">3.16. </a><a class="section-name selfRef" href="#name-null">Null</a>
</h3>
<p id="section-3.16-1">The symbol <code>#null</code> represents a null Value (<a class="auto internal xref" href="#value">Section 3.7</a>). It's up to the
implementation to decide how to represent this, but it generally signals the
"absence" of a value.<a class="pilcrow" href="#section-3.16-1">¶</a></p>
<div id="example-7">
<section id="section-3.16.1">
<h4 id="name-example-8">
<a class="section-number selfRef" href="#section-3.16.1">3.16.1. </a><a class="section-name selfRef" href="#name-example-8">Example</a>
</h4>
<div class="lang-kdl sourcecode" id="section-3.16.1-1">
<pre>
my-node #null key=#null
</pre><a class="pilcrow" href="#section-3.16.1-1">¶</a>
