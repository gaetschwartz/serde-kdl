[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kdl-org/serde-kdl"
authors = ["Gaëtan Schwartz"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
kdl = "6.5"
